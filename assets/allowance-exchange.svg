<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc"><title id="title">配額移轉的示意</title><desc id="desc">甲持有八十但需一百單位，乙持有八十但需六十單位；假設乙向甲移轉二十單位配額，不表示減少排放。</desc><rect width="960" height="390" rx="24" fill="#edf1e5"/><g font-family="Microsoft JhengHei, sans-serif" text-anchor="middle" fill="#203b32"><text x="480" y="46" font-size="20">配額持有量改變 ≠ 實際減排</text><rect x="42" y="85" width="295" height="230" rx="18" fill="#fffef9"/><rect x="623" y="85" width="295" height="230" rx="18" fill="#fffef9"/><g font-size="22"><text x="189" y="128">甲・配額不足</text><text x="770" y="128">乙・假設願意出售</text></g><g font-size="18"><text x="189" y="179">要涵蓋 100 公噸 CO₂e</text><text x="189" y="214">原持有 80 單位</text><text x="770" y="179">要涵蓋 60 公噸 CO₂e</text><text x="770" y="214">原持有 80 單位</text></g><g fill="#dfe7d7"><rect x="78" y="248" width="223" height="43" rx="8"/><rect x="659" y="248" width="223" height="43" rx="8"/></g><g font-size="19"><text x="189" y="276">移轉後：100 單位</text><text x="770" y="276">移轉後：60 單位</text></g><path d="M607 205H367" stroke="#66835c" stroke-width="5"/><path d="m383 192-17 13 17 13" fill="none" stroke="#66835c" stroke-width="5"/><text x="480" y="178" font-size="19">20 單位配額</text><text x="480" y="357" font-size="15">本站自製教學示意・暫不考慮其他交易條件、費用及期間</text></g></svg>
