<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="275" viewBox="0 0 1000 275" role="img" aria-labelledby="t d"><title id="t">同樣滿足需求但供給限制不同的兩個方案</title><desc id="d">本站自製教學示意，非實證資料或文獻原圖。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#456648"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#eef3e9"/><g font-family="Microsoft JhengHei,sans-serif" fill="#203b32"><text x="35" y="35" font-size="22" fill="#203b32" text-anchor="start">供給：乙最多10單位、丙最多5單位；甲需求12單位</text><rect x="35" y="65" width="420" height="70" rx="12" fill="#dfebd8" stroke="#a9bda0" stroke-width="2"/><text x="245.0" y="108.0" font-size="24" text-anchor="middle">方案A：乙8 ＋ 丙4 ＝ 12</text><rect x="545" y="65" width="420" height="70" rx="12" fill="#f6e7dc" stroke="#a9bda0" stroke-width="2"/><text x="755.0" y="108.0" font-size="24" text-anchor="middle">方案B：乙11 ＋ 丙1 ＝ 12</text><text x="55" y="180" font-size="22" fill="#203b32" text-anchor="start">✓ 需求滿足，兩賣方均未超額</text><text x="565" y="180" font-size="22" fill="#203b32" text-anchor="start">× 乙超過10單位上限</text><text x="35" y="237" font-size="21" fill="#203b32" text-anchor="start">可行性＝每一條限制都通過；總量相同，不代表兩個方案都可行。</text></g></svg>