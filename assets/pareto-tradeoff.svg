<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc"><title id="title">兩方案的成本利潤取捨</title><desc id="desc">成本希望越低越好，利潤越高越好。A成本80利潤20，B成本90利潤30，各有優勢，互不支配。兩點不足以估計完整Pareto前緣。</desc><rect width="900" height="440" rx="24" fill="#edf1e5"/><g font-family="Microsoft JhengHei, sans-serif" fill="#203b32"><text x="450" y="45" text-anchor="middle" font-size="22">A 與 B 各有優勢，互不支配</text><path d="M150 90V337H690" stroke="#6d805d" stroke-width="2" fill="none"/><g stroke="#c7d1bb"><path d="M150 170H680M150 270H680M330 100V337M540 100V337" stroke-dasharray="5 5"/></g><g font-size="17"><text x="115" y="277">20</text><text x="115" y="177">30</text><text x="319" y="365">80</text><text x="529" y="365">90</text><text x="180" y="92">利潤 ↑</text><text x="600" y="365">成本 →</text></g><circle cx="330" cy="270" r="10" fill="#41664d"/><circle cx="540" cy="170" r="10" fill="#ae833b"/><g font-size="21"><text x="350" y="263">A（80, 20）</text><text x="560" y="163">B（90, 30）</text></g><text x="450" y="408" text-anchor="middle" font-size="15">本站自製假設評估值・非市場價格或實驗資料・未繪製完整 Pareto 前緣</text></g></svg>
