<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc"><title id="title">單點交配與突變</title><desc id="desc">親代1100與0011在第二位後交換片段，得到1111及0000；另一獨立操作把1100的第二位改零得到1000。</desc><rect width="960" height="400" rx="24" fill="#edf1e5"/><g fill="#203b32" font-family="Microsoft JhengHei, sans-serif" text-anchor="middle"><text x="480" y="44" font-size="22">交配交換片段，突變改動個別位元</text><g font-size="18"><text x="240" y="92">親代・第二位後切割</text><text x="710" y="92">交換後段</text></g><g font-family="Consolas, monospace" font-size="40"><text x="240" y="153">11│00</text><text x="240" y="219">00│11</text><text x="710" y="153">11│11</text><text x="710" y="219">00│00</text></g><path d="M405 166H545m-17-12 17 12-17 12" fill="none" stroke="#7c926a" stroke-width="4"/><path d="M100 254H860" stroke="#bdc9b0"/><text x="480" y="296" font-size="18">獨立的突變示範：第二位 1 → 0</text><text x="480" y="343" font-family="Consolas, monospace" font-size="36">1100 → 1000</text><text x="480" y="378" font-size="14">指定操作的教學示意；未執行隨機搜尋，也不保證新方案更好或可行</text></g></svg>
