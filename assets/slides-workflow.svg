<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2226" viewBox="0 0 1400 2226" role="img" aria-labelledby="title desc">
<title id="title">從 Wiki 到教學投影片</title>
<desc id="desc">七階段由上往下。每階段列出工作、檢查及產物。內容失敗回04；介面失敗回05；缺乏依據回02。修改後重做06。橘色箭頭是條件式退回規則，不表示每次都觸發。</desc>
<defs><marker id="forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#365744"/></marker><marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#a34e2b"/></marker></defs>
<rect width="1400" height="2226" fill="#f7f4ec"/>
<g font-family="Microsoft JhengHei, sans-serif" fill="#203b32">
<text x="700" y="53" font-size="36" text-anchor="middle">從 Wiki 到教學投影片</text>
<rect x="220" y="100" width="960" height="188" rx="17" fill="#fffef9" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="146" font-size="31" font-weight="600" fill="#58734e">01</text>
<text x="324" y="146" font-size="29" font-weight="600">確認教學目標</text>
<text x="248" y="188" font-size="24">做：確認讀者、主題、深度與學習成果。</text>
<text x="248" y="222" font-size="24">查：初學者能理解嗎？內容聚焦研究如何進行嗎？</text>
<text x="248" y="256" font-size="24">留：已確認的目標與範圍。</text>
<path d="M700 292 V333" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="321" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="342" width="960" height="222" rx="17" fill="#fffef9" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="388" font-size="31" font-weight="600" fill="#58734e">02</text>
<text x="324" y="388" font-size="29" font-weight="600">查詢 Wiki 與來源</text>
<text x="248" y="430" font-size="24">做：先查索引，再讀正文、引用與相關圖解。</text>
<text x="248" y="464" font-size="24">查：主張有依據？事實、計畫、假設與結果有區分？</text>
<text x="248" y="498" font-size="24">查：圖片來源、可公開權限與數據身分清楚？</text>
<text x="248" y="532" font-size="24">留：可用主張、來源、限制與缺口。</text>
<path d="M700 568 V609" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="597" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="618" width="960" height="188" rx="17" fill="#e8efe2" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="664" font-size="31" font-weight="600" fill="#58734e">03</text>
<text x="324" y="664" font-size="29" font-weight="600">整理並確認大綱</text>
<text x="248" y="706" font-size="24">做：安排頁序、每頁主旨與教學問題。</text>
<text x="248" y="740" font-size="24">查：有無缺漏或重複？使用者確認後才寫逐頁稿。</text>
<text x="248" y="774" font-size="24">留：大綱；未通過就留在本階段調整。</text>
<path d="M700 810 V851" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="839" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="860" width="960" height="256" rx="17" fill="#fffef9" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="906" font-size="31" font-weight="600" fill="#58734e">04</text>
<text x="324" y="906" font-size="29" font-weight="600">撰寫逐頁內容</text>
<text x="248" y="948" font-size="24">做：寫解釋、例子、圖解、引用與每頁結論。</text>
<text x="248" y="982" font-size="24">查：忠於 Wiki，解釋足夠；不增添無據結論。</text>
<text x="248" y="1016" font-size="24">查：演算法等抽象概念有示意圖、依據及假設。</text>
<text x="248" y="1050" font-size="24">查：整理結論用「懶人包」，研究交付用「產出成果」。</text>
<text x="248" y="1084" font-size="24">留：逐頁稿；依據不足回 02，內容不足在此補寫。</text>
<path d="M700 1120 V1161" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="1149" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="1170" width="960" height="324" rx="17" fill="#fffef9" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="1216" font-size="31" font-weight="600" fill="#58734e">05</text>
<text x="324" y="1216" font-size="29" font-weight="600">生成 HTML 與排版</text>
<text x="248" y="1258" font-size="24">做：依稿生成 HTML；保留換頁、跳頁與 Wiki 入口。</text>
<text x="248" y="1292" font-size="24">查：節點有完整框線、貼切圖示；同頁圖示不重複。</text>
<text x="248" y="1326" font-size="24">查：固定頁框及標題；圖文錯開，不以加圖撐高頁面。</text>
<text x="248" y="1360" font-size="24">查：沒有頁內捲動區；答案展開可延長整頁。</text>
<text x="248" y="1394" font-size="24">查：字級適中、圖說貼近圖片；圖文間距及留白均衡。</text>
<text x="248" y="1428" font-size="24">查：過空先補必要解釋／重排，再補有來源授權的圖。</text>
<text x="248" y="1462" font-size="24">留：HTML；解釋不足回 04，版面問題在此修正。</text>
<path d="M700 1498 V1539" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="1527" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="1548" width="960" height="324" rx="17" fill="#e8efe2" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="1594" font-size="31" font-weight="600" fill="#58734e">06</text>
<text x="324" y="1594" font-size="29" font-weight="600">實際瀏覽與回歸檢查</text>
<text x="248" y="1636" font-size="24">查桌機：四種 PC 尺寸完整顯示，換頁標題不跳。</text>
<text x="248" y="1670" font-size="24">查手機：不水平溢出，沒有任何內部捲動容器。</text>
<text x="248" y="1704" font-size="24">查圖文：圖像完整、字可讀、框線／圖示／來源正確。</text>
<text x="248" y="1738" font-size="24">查操作：箭頭、鍵盤、跳頁、答案開合與連結。</text>
<text x="248" y="1772" font-size="24">查備援：全文、列印、深層連結與無 JavaScript。</text>
<text x="248" y="1806" font-size="24">留：截圖與量測；人工再核對內容、圖解及視覺平衡。</text>
<text x="248" y="1840" font-size="24">不通過：回 04 修內容或回 05 修介面，再重測此處。</text>
<path d="M700 1876 V1917" fill="none" stroke="#365744" stroke-width="3" marker-end="url(#forward)"/><text x="722" y="1905" font-size="19" fill="#58734e">通過</text>
<rect x="220" y="1926" width="960" height="222" rx="17" fill="#fffef9" stroke="#9aaf8d" stroke-width="2"/>
<text x="248" y="1972" font-size="31" font-weight="600" fill="#58734e">07</text>
<text x="324" y="1972" font-size="29" font-weight="600">使用者試讀、定案與發布</text>
<text x="248" y="2014" font-size="24">做：使用者試讀；問題依性質回 02／04／05 修正。</text>
<text x="248" y="2048" font-size="24">查：重做 06，使用者明確定案後才標示已驗收。</text>
<text x="248" y="2082" font-size="24">做：保存版本與檢查紀錄，依當批授權推送 GitHub。</text>
<text x="248" y="2116" font-size="24">查：公開簡報與圖片的版本、內容與本機一致。</text>
<path d="M1180 952 H1260 V432 H1190" fill="none" stroke="#a34e2b" stroke-width="3" marker-end="url(#return)"/>
<rect x="1202" y="661" width="190" height="72" rx="8" fill="#f7f4ec"/>
<text x="1210" y="688" font-size="23" fill="#a34e2b">依據不足</text>
<text x="1210" y="719" font-size="23" fill="#a34e2b">回 02 閱讀</text>
<path d="M220 1668 H60 V955 H210" fill="none" stroke="#a34e2b" stroke-width="3" marker-end="url(#return)"/>
<rect x="10" y="1185" width="190" height="72" rx="8" fill="#f7f4ec"/>
<text x="18" y="1212" font-size="23" fill="#a34e2b">內容／解釋不足</text>
<text x="18" y="1243" font-size="23" fill="#a34e2b">回 04 修改</text>
<path d="M1180 1753 H1315 V1310 H1190" fill="none" stroke="#a34e2b" stroke-width="3" marker-end="url(#return)"/>
<rect x="1197" y="1378" width="190" height="72" rx="8" fill="#f7f4ec"/>
<text x="1205" y="1405" font-size="23" fill="#a34e2b">版面／操作失敗</text>
<text x="1205" y="1436" font-size="23" fill="#a34e2b">回 05 修改</text>
<text x="700" y="2198" text-anchor="middle" font-size="24">Loop：發現問題 → 回對應步驟修改 → 重測原問題與受影響項目。</text>
</g></svg>
