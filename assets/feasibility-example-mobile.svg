<svg xmlns="http://www.w3.org/2000/svg" width="360" height="435" viewBox="0 0 360 435" role="img" aria-labelledby="t d"><title id="t">兩個方案的供需可行性比較</title><desc id="d">本站自製教學示意，非實證資料或文獻原圖。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#456648"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#eef3e9"/><g font-family="Microsoft JhengHei,sans-serif" fill="#203b32"><text x="20" y="32" font-size="20" fill="#203b32" text-anchor="start">供給：乙最多10、丙最多5</text><text x="20" y="65" font-size="20" fill="#203b32" text-anchor="start">需求：甲需要12單位</text><rect x="20" y="100" width="320" height="65" rx="12" fill="#dfebd8" stroke="#a9bda0" stroke-width="2"/><text x="180.0" y="140.5" font-size="24" text-anchor="middle">A：乙8＋丙4＝12</text><text x="25" y="205" font-size="19" fill="#203b32" text-anchor="start">✓ 需求與供給限制均通過</text><rect x="20" y="255" width="320" height="65" rx="12" fill="#f6e7dc" stroke="#a9bda0" stroke-width="2"/><text x="180.0" y="295.5" font-size="24" text-anchor="middle">B：乙11＋丙1＝12</text><text x="25" y="360" font-size="19" fill="#203b32" text-anchor="start">× 乙超過10單位上限</text><text x="20" y="405" font-size="18" fill="#203b32" text-anchor="start">總量相同，不一定都可行。</text></g></svg>