<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="t d"><title id="t">乙向甲移轉20單位配額</title><desc id="d">本站自製示意。甲需100、原有80，乙需60、原有80；移轉後甲100、乙60，不等於減排。</desc><rect width="640" height="300" rx="18" fill="#edf2e7"/><g fill="#203b32" font-family="Microsoft JhengHei,sans-serif" text-anchor="middle"><rect x="18" y="45" width="225" height="220" rx="14" fill="#fffef9"/><rect x="397" y="45" width="225" height="220" rx="14" fill="#fffef9"/><text x="130" y="30" font-size="25">甲・買方</text><text x="510" y="30" font-size="25">乙・賣方</text><g font-size="25"><text x="130" y="95">需求 100</text><text x="130" y="140">原有 80</text><text x="510" y="95">需求 60</text><text x="510" y="140">原有 80</text></g><path d="M386 151H255m17-12-17 12 17 12" stroke="#55794a" stroke-width="4" fill="none"/><text x="320" y="109" font-size="27">20單位</text><g font-size="27"><text x="130" y="220">移轉後 100</text><text x="510" y="220">移轉後 60</text></g></g></svg>
